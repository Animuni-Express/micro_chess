[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  BUN_VERSION = "1.4.4"
  BUN_FLAGS = "--frozen-lockfile"

[dev]
  command = "bun run dev:netlify"
  targetPort = 8080
  port = 8888
  autoLaunch = false

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Idle database cost: run cleanup only every six hours (UTC).
[functions."cleanup"]
  schedule = "0 */6 * * *"

[[edge_functions]]
  path = "/api/multiplayer/*"
  function = "multiplayer"
